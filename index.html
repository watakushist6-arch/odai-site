<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>今日のおだい</title>
<meta name="description" content="毎日ひとつ、1分でできる小さなおだいに、写真1枚で答えよう。少人数のチームで、おたがいの毎日をのぞき見。" />
<style>
  :root { --coral:#ff5d4a; --ink:#2b2230; --bg:#fff7f0; --line:#f0e3da; }
  * { box-sizing: border-box; }
  body { font-family: 'Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif; color:var(--ink); background:var(--bg); margin:0; line-height:1.8; font-size:16px; -webkit-text-size-adjust:100%; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px 48px; text-align:center; }
  .logo { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 20px; display:block; background: linear-gradient(135deg,#ff9a6b,#ff5d7a); box-shadow: 0 10px 28px rgba(255,93,122,.3); }
  h1 { font-size: 30px; margin: 0 0 8px; }
  .lead { font-size: 17px; margin: 0 0 28px; }
  .store { display:inline-block; background:var(--ink); color:#fff; text-decoration:none; padding:14px 28px; border-radius:999px; font-weight:700; }
  .store.soon { opacity:.55; pointer-events:none; }
  .points { list-style:none; padding:0; margin:36px 0 0; text-align:left; }
  .points li { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; }
  footer { margin-top:48px; font-size:14px; display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
  a { color:var(--coral); }
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="今日のおだい"></div>
  <h1>今日のおだい</h1>
  <p class="lead">毎日ひとつ、1分でできる小さなおだいに、<br />写真1枚で答えよう。</p>
  <!-- App Store公開後、href をアプリのURLに差し替える -->
  <a class="store soon" href="#">App Storeで入手</a>

  <ul class="points">
    <li>📷 毎日、みんな同じ「おだい」が出ます</li>
    <li>🔒 自分が投稿するまで、みんなの投稿はおあずけ</li>
    <li>👥 最大6人の小さなチームで、気軽にシェア</li>
  </ul>

  <footer>
    <a href="./support.html">サポート</a>
    <a href="./terms.html">利用規約</a>
    <a href="./privacy.html">プライバシーポリシー</a>
  </footer>
</main>
</body>
</html>
